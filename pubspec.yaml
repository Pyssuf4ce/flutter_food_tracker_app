name: flutter_food_tracker_app
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ">=3.2.0 < 4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2
  image_picker: ^1.2.1 #ใช้เปิดกล้อง เปิดแกลลอรี่
  intl: ^0.20.2 #ใช้จัด format ของวันที่ เวลา ตัวเลข
  supabase_flutter: ^2.12.2 #ใช้เชื่อมต่อกับ supabase

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  icons_launcher: ^3.1.0

icons_launcher:
  image_path: "assets/icon/"
  platforms:
    android:
      enable: true
    ios:
      enable: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/

